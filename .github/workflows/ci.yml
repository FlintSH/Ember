name: CI

# Every push and pull request is built, linted, unit tested, checked against a
# real Flare server, and walked through on Android 16 and 17 emulators. Pushes to
# main then publish the exact APK that passed:
#   - a stable release when version.properties names a version with no tag yet
#   - otherwise the rolling pre-release, a separate app installable next to stable
# See docs/releasing.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel main: each push publishes the build it tested.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The Flare release Ember is tested against.
  FLARE_IMAGE: docker.io/flintsh/flare:3.0.0
  JAVA_VERSION: '21'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      sha: ${{ steps.plan.outputs.sha }}
      package: ${{ steps.plan.outputs.package }}
      apk: ${{ steps.plan.outputs.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        name: Choose the release channel
        run: |
          version=$(sed -n 's/^versionName=//p' version.properties)
          sha=$(git rev-parse --short=7 HEAD)
          {
            echo "version=$version"
            echo "sha=$sha"
            echo "version_code=$(git rev-list --count HEAD)"
          } >> "$GITHUB_OUTPUT"
          channel=stable
          publish=none
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              channel=rolling
              publish=rolling
            else
              publish=stable
            fi
          fi
          if [ "$channel" = rolling ]; then
            echo "package=dev.fl1nt.ember.rolling" >> "$GITHUB_OUTPUT"
            echo "apk=Ember-rolling-$sha.apk" >> "$GITHUB_OUTPUT"
          else
            echo "package=dev.fl1nt.ember" >> "$GITHUB_OUTPUT"
            echo "apk=Ember-$version.apk" >> "$GITHUB_OUTPUT"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Building $channel ($version, $sha); publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and test
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Only publishing runs on main get the signing secrets. Pull request builds
      # run branch-controlled build code, so they're signed with the debug key.
      - name: Prepare release signing
        if: needs.plan.outputs.publish != 'none'
        env:
          EMBER_KEYSTORE_BASE64: ${{ secrets.EMBER_KEYSTORE_BASE64 }}
          EMBER_KEYSTORE_PASSWORD: ${{ secrets.EMBER_KEYSTORE_PASSWORD }}
          EMBER_KEY_PASSWORD: ${{ secrets.EMBER_KEY_PASSWORD }}
        run: |
          if [ -z "$EMBER_KEYSTORE_BASE64" ] || [ -z "$EMBER_KEYSTORE_PASSWORD" ] || [ -z "$EMBER_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. See docs/releasing.md."
            exit 1
          fi
          echo "$EMBER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ember.keystore"
          {
            echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember.keystore"
            echo "EMBER_KEYSTORE_PASSWORD=$EMBER_KEYSTORE_PASSWORD"
            # The alias isn't secret, and as a secret GitHub would mask every "ember" in the logs.
            echo "EMBER_KEY_ALIAS=ember"
            echo "EMBER_KEY_PASSWORD=$EMBER_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Lint, test, verify screenshots, and build
        run: >
          ./gradlew --stacktrace
          :api:test :app:lintDebug :app:verifyRoborazziDebug
          :app:assembleRelease :e2e:assembleDebug
          -Pember.channel=${{ needs.plan.outputs.channel }}
          -Pember.versionCode=${{ needs.plan.outputs.version_code }}
          -Pember.commit=${{ needs.plan.outputs.sha }}

      - name: Check the APK signature
        env:
          EXPECTED_CERT: ${{ vars.EMBER_SIGNING_CERT_SHA256 }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if [ "$PUBLISH" != none ]; then
            actual=$(sed -n 's/.*certificate SHA-256 digest: //p' signature.txt | head -1)
            if [ -z "$EXPECTED_CERT" ] || [ "$actual" != "$EXPECTED_CERT" ]; then
              echo "::error::The APK is not signed with Ember's release key (got $actual)."
              exit 1
            fi
          fi

      - name: Collect the tested APK
        env:
          APK: ${{ needs.plan.outputs.apk }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK"
          (cd dist && sha256sum "$APK" > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ember-apk
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-apk
          path: e2e/build/outputs/apk/debug/e2e-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: build-reports
          path: |
            **/build/reports/
            app/build/outputs/roborazzi/

  live-api:
    name: Live Flare API
    needs: plan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flare
          POSTGRES_PASSWORD: flarepassword
          POSTGRES_DB: flare
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U flare" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Start Flare
        run: scripts/ci/start-flare.sh "$RUNNER_TEMP/flare-fixture.json"
      - name: Run Ember's client against Flare
        run: FLARE_FIXTURE="$RUNNER_TEMP/flare-fixture.json" ./gradlew :api:integrationTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-api-report
          path: api/build/reports/tests/integrationTest/

  e2e:
    name: Emulator (Android ${{ matrix.android }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both reach the runner's Flare through the emulator's alias for the host.
          - android: '16'
            api: 36
            image: '36'
            url: http://10.0.2.2:3000
          # On Android 17 that's a local network address, which exercises the local
          # network permission prompt. Its SDK packages carry a minor version, such
          # as platforms;android-37.0.
          - android: '17'
            api: '37.0'
            image: '37.0'
            url: http://10.0.2.2:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flare
          POSTGRES_PASSWORD: flarepassword
          POSTGRES_DB: flare
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U flare" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ember-apk
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-apk
          path: e2e-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start Flare
        run: |
          scripts/ci/start-flare.sh "$RUNNER_TEMP/flare-fixture.json"
          token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tokens"]["all"])' "$RUNNER_TEMP/flare-fixture.json")
          echo "::add-mask::$token"
          echo "FLARE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Walk through Ember on the emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          FLARE_URL: ${{ matrix.url }}
          EMBER_PACKAGE: ${{ needs.plan.outputs.package }}
          E2E_LABEL: android-${{ matrix.android }}
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # The default data partition is too small for Android 17 to install anything.
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: scripts/ci/run-e2e.sh "dist/${{ needs.plan.outputs.apk }}" e2e-apk/e2e-debug.apk "e2e-results"
      - name: Flare server log
        if: failure()
        run: docker logs flare | tail -100
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-android-${{ matrix.android }}
          path: e2e-results/

  publish:
    name: Publish ${{ needs.plan.outputs.publish }}
    needs: [plan, build, live-api, e2e]
    if: needs.plan.outputs.publish != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ember-apk
          path: dist
      - name: Verify the tested APK
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish the stable release
        if: needs.plan.outputs.publish == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          notes=".github/release-notes/v$VERSION.md"
          if [ ! -f "$notes" ]; then
            previous=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || true)
            range=${previous:+$previous..}HEAD
            {
              echo "## Changes"
              echo
              git log --no-merges --pretty='- %s' "$range"
            } > "$RUNNER_TEMP/notes.md"
            notes="$RUNNER_TEMP/notes.md"
          fi
          # Optional demo screenshots and recordings, one repository path per line.
          assets=()
          list=".github/release-notes/v$VERSION.assets"
          if [ -f "$list" ]; then
            while IFS= read -r path; do
              case "$path" in ''|'#'*) continue ;; esac
              assets+=("$path")
            done < "$list"
          fi
          gh release create "v$VERSION" dist/*.apk dist/SHA256SUMS "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Ember $VERSION" \
            --notes-file "$notes"
      - name: Publish the rolling pre-release
        if: needs.plan.outputs.publish == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git tag -f rolling "$GITHUB_SHA"
          git push -f origin refs/tags/rolling
          cat > "$RUNNER_TEMP/rolling.md" <<NOTES
          Built from [\`$SHA\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA), after Ember $VERSION. It passed the same tests as a stable release.

          This is **Ember Rolling**, a separate app (\`dev.fl1nt.ember.rolling\`) that installs next to the stable app, so trying \`main\` never blocks a stable update. It updates with every push to \`main\` and can be less polished.
          NOTES
          if gh release view rolling >/dev/null 2>&1; then
            gh release view rolling --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset rolling "$asset" --yes
            done
            gh release edit rolling --title "Ember Rolling ($SHA)" --notes-file "$RUNNER_TEMP/rolling.md" --prerelease --target "$GITHUB_SHA"
          else
            gh release create rolling --title "Ember Rolling ($SHA)" --notes-file "$RUNNER_TEMP/rolling.md" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload rolling dist/*.apk dist/SHA256SUMS --clobber
